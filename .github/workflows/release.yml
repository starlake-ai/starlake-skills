name: release

# Publishing a release = pushing a vX.Y.Z tag.
# Packs the skills bundle into .tar.gz (macOS/Linux) and .zip (Windows) assets
# consumed by scripts/install-remote.sh / install-remote.ps1.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundle
        run: |
          mkdir -p staging/starlake-skills dist
          cp -R .agents scripts .claude-plugin README.md LICENSE staging/starlake-skills/
          echo "${GITHUB_REF_NAME}" > staging/starlake-skills/VERSION

      - name: Pack assets
        working-directory: staging
        run: |
          tar -czf ../dist/starlake-skills-${GITHUB_REF_NAME}.tar.gz starlake-skills
          zip -qr ../dist/starlake-skills-${GITHUB_REF_NAME}.zip starlake-skills

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
